name: Manage portal access

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, set-reader]
        default: inspect
        required: true
      username:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: rts-production
  cancel-in-progress: false

jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/portal-access.mjs
        env:
          PORTAL_OPERATION: ${{ inputs.operation }}
          PORTAL_USERNAME: ${{ inputs.username }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
