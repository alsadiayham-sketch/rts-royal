<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="طلب انضمام منشأة إلى Jahiz جاهز من RTS"><title>طلب انضمام | Jahiz</title><link rel="stylesheet" href="/jahiz/jahiz.css"></head><body data-page="signup"><a class="skip" href="#main">تخطي إلى المحتوى</a><header class="j-shell j-top"><a class="j-brand" href="/jahiz/"><span class="j-mark">ج</span><span>Jahiz <b>جاهز</b></span></a><div class="j-actions"><button class="j-lang" type="button" data-lang>English</button><a class="j-button secondary" href="/jahiz/login/">دخول المالك</a></div></header><main id="main" class="j-shell j-page"><section class="j-panel"><div class="j-page-head"><p class="j-kicker">للمقاهي والمطاعم</p><h1>اطلب تفعيل جاهز لمنشأتك</h1><p>يُراجع طلبك أولاً. لا ينشئ هذا النموذج دخولاً أو كلمة مرور.</p></div><div id="application-feedback" class="j-feedback hidden" role="status" aria-live="polite"></div><form id="application-form" novalidate><div class="j-grid"><div class="j-field"><label for="business-name">اسم المنشأة</label><input id="business-name" name="name" required maxlength="120" autocomplete="organization"></div><div class="j-field"><label for="business-type">نوع المنشأة</label><select id="business-type" name="businessType"><option value="cafe">مقهى</option><option value="restaurant">مطعم</option></select></div><div class="j-field"><label for="owner-name">اسم المسؤول</label><input id="owner-name" name="ownerName" required maxlength="120" autocomplete="name"></div><div class="j-field"><label for="email">البريد الإلكتروني</label><input id="email" name="email" required type="email" maxlength="160" autocomplete="email" dir="ltr"></div><div class="j-field"><label for="phone">الهاتف</label><input id="phone" name="phone" required type="tel" maxlength="40" autocomplete="tel" dir="ltr"></div><div class="j-field j-full"><label for="message">ملاحظة اختيارية</label><textarea id="message" name="message" maxlength="1000"></textarea></div></div><div class="j-form-actions"><button class="j-button" type="submit">إرسال طلب المراجعة</button></div></form></section></main><script type="module" src="/jahiz/jahiz.js"></script></body></html>
