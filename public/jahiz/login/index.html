<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>دخول المالك | Jahiz</title><link rel="stylesheet" href="/jahiz/jahiz.css"></head><body data-page="login"><header class="j-shell j-top"><a class="j-brand" href="/jahiz/"><span class="j-mark">ج</span><span>Jahiz <b>جاهز</b></span></a><div class="j-actions"><button class="j-lang" type="button" data-lang>English</button></div></header><main class="j-shell j-page"><section class="j-panel"><div class="j-page-head"><p class="j-kicker">مساحة المالك</p><h1>دخول آمن إلى العمليات</h1><p>أدخل رمز المنشأة وبيانات المستخدم التي استلمتها بعد الموافقة.</p></div><div id="login-feedback" class="j-feedback hidden" role="alert" aria-live="assertive"></div><form id="login-form" novalidate><div class="j-field"><label for="slug">رمز المنشأة</label><input id="slug" name="slug" required pattern="[A-Za-z0-9-]{2,80}" autocomplete="organization" dir="ltr"></div><div class="j-field"><label for="username">اسم المستخدم</label><input id="username" name="username" required autocomplete="username" dir="ltr"></div><div class="j-field"><label for="password">كلمة المرور</label><input id="password" name="password" required type="password" autocomplete="current-password" dir="ltr"></div><button class="j-button" type="submit">تسجيل الدخول</button></form></section></main><script type="module" src="/jahiz/jahiz.js"></script></body></html>
